<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首都医科大学在线课表生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>首都医科大学在线课表生成器 <small style="font-size:.45em;color:#888;">V3.1</small></h1>

    <section class="card one-click-card">
      <h2>一键导出（浏览器插件版）</h2>
      <p>
        目前支持基于Chromium内核的浏览器，例如Chrome、Edge、Opera...
      </p>
      <p class="privacy-note">
        🔒 页面加载后，课表解析和 XLSX 生成均在浏览器本地完成。
      </p>
      <p class="privacy-note">
        <a href="https://graduate-443.webvpn.ccmu.edu.cn/#/student/courseManage/timetable" target="_blank" rel="noopener noreferrer">打开教务系统课表页</a>
        <p class="privacy-note"><a href="https://github.com/ccmu-schedule/schedule/blob/main/README.md" target="_blank" rel="noopener noreferrer">打开使用教程页</a>
      </p>
    </section>

    <section class="card">
      <h2>手动导出（备用）</h2>
      <p>把 Network → <code>queryStudentSchedule</code> → Response 中的 JSON 完整粘贴到下方。</p>
      <p class="privacy-note">🔒 页面加载后，课表解析和 XLSX 生成均在浏览器本地完成。</p>
      <textarea id="jsonInput" placeholder="在此处粘贴 queryStudentSchedule 的 Response JSON..."></textarea>
      <div class="actions">
        <button id="generateBtn" type="button">解析并生成课表 (.xlsx)</button>
        <button id="pasteBtn" type="button" class="secondary-btn">从剪贴板读取</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <pre id="diagnostics" class="diagnostics" hidden></pre>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
